org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Configuración de la app (todo lo propio de Rastro está aquí) ----
# Identificador en Google Play. ¡No se puede cambiar después de la primera publicación!
rastro.applicationId=io.github.rvix10.rastro
# Dónde está publicada la app web (GitHub Pages). El host debe servir /.well-known/assetlinks.json en su raíz.
rastro.host=rvix10.github.io
rastro.startPath=/rastroEdit/
rastro.appName=Rastro
# Versión visible en Play. El número interno (versionCode) sale del número de ejecución de GitHub Actions.
rastro.versionName=1.0.0
